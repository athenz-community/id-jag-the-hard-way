name: Build and Push IDTHW Demo API MCP

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/idthw-demo-api-mcp/**"
      - ".github/workflows/publish-idthw-demo-api-mcp.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/idthw-demo-api-mcp/**"
      - ".github/workflows/publish-idthw-demo-api-mcp.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: idthw-demo-api-mcp
  BUILD_DIR: ./components/idthw-demo-api-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_GHCR_SECRET || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr,prefix=pr
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run checks
        working-directory: ${{ env.BUILD_DIR }}
        run: npm run check && npm test

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_DIR }}
          file: ${{ env.BUILD_DIR }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
