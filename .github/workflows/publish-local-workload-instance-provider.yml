# This workflow packages the standalone provider JAR in an OCI image and
# publishes it to GHCR. Loading the JAR into ZTS remains a separate, deferred
# integration step.

name: Build and Push LocalWorkloadInstanceProvider JAR file

on:
  push:
    branches: ["main"]
    paths:
      - "local_workload_instance_provider/**"
      - ".github/workflows/publish-local-workload-instance-provider.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "local_workload_instance_provider/**"
      - ".github/workflows/publish-local-workload-instance-provider.yml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: local-workload-instance-provider
  BUILD_DIR: ./local_workload_instance_provider

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: local_workload_instance_provider/pom.xml

      - name: Build and test with Maven
        working-directory: ${{ env.BUILD_DIR }}
        run: make build

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_GHCR_SECRET || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr,prefix=pr
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
