name: Build and Publish MCP Credential Broker

on:
  push:
    branches: ["main"]
    paths:
      - "components/mcp-credential-broker/**"
      - ".github/workflows/publish-mcp-credential-broker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "components/mcp-credential-broker/**"
      - ".github/workflows/publish-mcp-credential-broker.yml"
  workflow_dispatch:

env:
  PACKAGE_DIR: components/mcp-credential-broker

jobs:
  test-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check, test, and build
        run: make check test build

      - name: Verify package contents
        run: npm pack --dry-run

  publish-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@mlajkim"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
