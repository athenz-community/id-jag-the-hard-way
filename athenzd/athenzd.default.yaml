# athenzd.default.yaml
# Copy to ~/.config/athenzd/config.yaml and fill in REQUIRED fields.
# Lines marked REQUIRED must be set — athenzd will refuse to start without them.

# ── Athenz Core ───────────────────────────────────────────────────────────────
athenz:
  zts:                          # REQUIRED  e.g. https://zts.athenz.example.com:4443/zts/v1
  zms:                          # REQUIRED by login  e.g. https://zms.athenz.example.com:4443/zms/v1
  ca_file:                      # optional  trust a private CA for Athenz HTTPS

# ── Context (like kubectl current-context) ───────────────────────────────────
current_service: ""             # active profile and token-cache key; not the Athenz identity

# ── GenAI ID-JAG ──────────────────────────────────────────────────────────────
gen_ai:
  # Each matching domain is one service project. A user may belong to several;
  # athenzd issues one ID-JAG per project with all mutually eligible roles.
  domain:                       # optional with role  e.g. gen-ai.services.{{service}}
  role:                         # optional with domain  e.g. gen-ai-users
  # One service project used to mint the initial access token for its baseline
  # role. When empty, login prompts from eligible projects and saves it here.
  default_project:              # optional  e.g. athenz

# ── Services ──────────────────────────────────────────────────────────────────
services:
  - name:                       # REQUIRED  unique local profile name
    athenz:
      # Go template; preferred_username comes from the freshly issued ID token.
      service: home.{{.preferred_username}}.local.athenzd
      # optional_admins:        # optional additional members of the child domain's admin role
      #   - user.platform_admin
      # provider:               # REQUIRED when identity.mode=copperargos
    idp:
      issuer:                   # REQUIRED  e.g. https://localhost:34444/realms/master
      client_id:                # REQUIRED  e.g. athenzd
      callback_port: 8250       # optional  local port for PKCE redirect
      ca_file:                  # optional  trust a private CA for the IdP HTTPS cert

    # identity:                 # optional; omit for login + ZMS setup only
    #   mode: copperargos       # currently supported mode
    #   instance_id:            # REQUIRED, stable id within the provider namespace
    #   cert_file: ~/.config/athenzd/identity/service.cert.pem
    #   key_file:  ~/.config/athenzd/identity/service.key.pem
    #   ca_file:   ~/.config/athenzd/identity/ca.cert.pem
    #   expiry_minutes: 60      # optional; 0 lets ZTS choose its default
    # Future mode=local will read externally managed cert/key/CA files; it is not implemented yet.

