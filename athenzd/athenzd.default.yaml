# athenzd.default.yaml
# Copy to ~/.config/athenzd/config.yaml and fill in REQUIRED fields.
# Lines marked REQUIRED must be set — athenzd will refuse to start without them.

# ── Athenz Core ───────────────────────────────────────────────────────────────
athenz:
  zts:                          # REQUIRED  e.g. https://zts.athenz.example.com:4443/zts/v1
  zms:                          # REQUIRED by login  e.g. https://zms.athenz.example.com:4443/zms/v1
  ca_file:                      # optional  trust a private CA for Athenz HTTPS

# ── Context (like kubectl current-context) ───────────────────────────────────
current_service: ""             # active profile and token-cache key; not the Athenz identity

# ── Services ──────────────────────────────────────────────────────────────────
services:
  - name:                       # REQUIRED  unique local profile name
    athenz:
      # Go template; preferred_username comes from the freshly issued ID token.
      service: home.{{.preferred_username}}.local.athenzd
      # optional_admins:        # optional additional members of the child domain's admin role
      #   - user.platform_admin
      # provider: sys.auth.zts  # reserved for later certificate registration
    idp:
      issuer:                   # REQUIRED  e.g. https://localhost:34444/realms/master
      client_id:                # REQUIRED  e.g. athenzd
      callback_port: 8250       # optional  local port for PKCE redirect
      ca_file:                  # optional  trust a private CA for the IdP HTTPS cert

