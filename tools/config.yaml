# DO NOT MODIFY THIS SETTING: IT IS THE DEFAULT
# THIS FILE IS OVERRIDEN BY THE config.local.yaml IF IT EXISTS.
ports:
  zms: 4443
  zts: 8443
  athenz-ui: 3000
  api-server: 14443
  core-mcp-proxy: 24442
  mcp: 24443
  confluence-mcp: 24444
  keycloak: 34443
  keycloak-https: 34444
  agentgateway: 44440
  agentgateway-admin: 44441
  ai-client-gateway: 44443
  ai-client-gateway-codex: 44444
  open-webui: 54443
  genai-proxy: 64443
  athenzd-genai-proxy: 65443

keycloak:
  realm: master
  admin: admin
  admin-password: admin
  user-password: password
  # About cimd: https://datatracker.ietf.org/doc/draft-ietf-oauth-client-id-metadata-document/
  cimd:
    client-host: cimd-client-metadata.idp.svc.cluster.local
    client-id: http://cimd-client-metadata.idp.svc.cluster.local/client.json
    mismatched-client-id: http://cimd-client-metadata.idp.svc.cluster.local/mismatched.json
    callback-host: 127.0.0.1
    callback-port: 9214
    redirect-uri: http://127.0.0.1:9214/callback
