# Athenz permission model for the mcp-hub domain.
# Edit this file to change MCP Hub services, roles, members, and policies.
# Apply with: ./tools/setup-permissions.sh tools/config/mcp-hub.yaml

domain: mcp-hub

# Service identities in this domain
services:
  - name: api-mcp
    key_version: v1
    local_keys_dir: ./keys
    k8s:
      ns: mcp-hub
      deployment: api-mcp
      secret:
        name: api-mcp-cert
        files:
          cert:
            k8s_name: api-mcp.crt
            local_name: api-mcp.crt
          key:
            k8s_name: api-mcp.key
            local_name: api-mcp.key
          ca:
            k8s_name: ca.crt
            import_from: ./athenz_dist/certs/ca.cert.pem

  - name: zpu
    key_version: v1
    local_keys_dir: ./keys
    k8s:
      ns: mcp-hub
      deployment: api-mcp
      secret:
        name: mcp-hub-zpu-cert
        files:
          cert:
            k8s_name: cert
            local_name: zpu.crt
          key:
            k8s_name: key
            local_name: zpu.key
          ca:
            k8s_name: ca
            import_from: ./athenz_dist/certs/ca.cert.pem

roles:
  # api-mcp-accessor: human user => access the api-mcp MCP auth resource
  - name: api-mcp-accessor
    members:
      - human.idjag-learner
    policies:
      - allow: access
        on: api-mcp

  # docs-getter: temporary same-domain scope until Athenz supports multi-domain AT scopes
  - name: docs-getter
    members:
      - human.idjag-learner

  # token-exchanging-mcp: MCP server => use mcp-hub tokens as the source for api token exchange
  - name: token-exchanging-mcp
    members:
      - mcp-hub.api-mcp
    policies:
      - allow: zts.token_source_exchange
        on: api

  # token-exchangable-ai-agents: AI client gateways => exchange into api-mcp-accessor on the user's behalf
  - name: token-exchangable-ai-agents
    members:
      - human.idjag-learner.claude
      - human.idjag-learner.codex
      - ai.open-webui
    policies:
      - allow: zts.jag_exchange
        on: role.api-mcp-accessor
