<svg xmlns="http://www.w3.org/2000/svg" width="1432" height="392" viewBox="0 0 1432 392" role="img" aria-labelledby="title desc"><title id="title">The AI agent retrieves documents through MCP using an API access token</title><desc id="desc">Claude Code, Codex, or Open WebUI calls get_k8s_docs with the learner's API access token in the Authorization bearer header. The MCP server forwards the same token with GET /api/docs. The Resource Server validates the token's API audience and document-read permission, then returns 200 OK and documents. MCP returns the document tool result to the AI agent.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#537AC7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#428B76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#C46864" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8B96AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8770B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><g id="access-token-key" transform="rotate(42 22 22)"><path d="M19 15h6v12h5v5h-5v8h-6Z" fill="currentColor"/><circle cx="22" cy="10" r="9" fill="currentColor"/><circle cx="22" cy="9" r="3.2" fill="white"/><path d="M16 8a6 6 0 0 1 9-3M20.5 20v15" fill="none" stroke="white" stroke-opacity=".48" stroke-width="1.4" stroke-linecap="round"/></g><filter id="card-shadow" x="-12%" y="-18%" width="124%" height="148%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#253B68" flood-opacity=".055"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".7" fill="#C9D2E2" opacity=".38"/></pattern></defs><rect x=".5" y=".5" width="1431" height="391" rx="26" fill="#FDFEFF" stroke="#E7ECF4"/><rect x="20" y="20" width="1392" height="352" rx="18" fill="url(#grid)"/><g font-family="Avenir Next, Avenir, Segoe UI, Helvetica, Arial, sans-serif"><path d="M328 156 L576 156" fill="none" stroke="#537AC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="328" cy="156" r="3" fill="white" stroke="#537AC7" stroke-width="1.5"/><path d="M856 156 L1104 156" fill="none" stroke="#537AC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="856" cy="156" r="3" fill="white" stroke="#537AC7" stroke-width="1.5"/><path d="M1104 244 L856 244" fill="none" stroke="#428B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7" marker-end="url(#arrow-green)"/><circle cx="1104" cy="244" r="3" fill="white" stroke="#428B76" stroke-width="1.5"/><path d="M576 244 L328 244" fill="none" stroke="#428B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7" marker-end="url(#arrow-green)"/><circle cx="576" cy="244" r="3" fill="white" stroke="#428B76" stroke-width="1.5"/><g data-component="client"><rect x="48" y="96" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="70" y="116" width="58" height="58" rx="16" fill="#FAEDE6"/><g transform="translate(79 125) scale(0.7692307692307693)" color="#B96850"><rect x="3" y="5" width="47" height="39" rx="8" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="m12 19 6 6-6 6m13 1h10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m43 0 2.5 6.5L52 9l-6.5 2.5L43 18l-2.5-6.5L34 9l6.5-2.5Z" fill="currentColor"/></g><text x="70" y="204" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">AI Agent</text><text x="70" y="276" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">Codex, Claude Code, etc.</text></g><g data-component="mcp"><rect x="576" y="96" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="598" y="116" width="58" height="58" rx="16" fill="#F0EDFA"/><g transform="translate(607 125) scale(0.7692307692307693)" color="#7361B2"><rect x="9" y="9" width="34" height="34" rx="10" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="M18 1v8m16-8v8M18 43v8m16-8v8M1 18h8m-8 16h8m34-16h8m-8 16h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="m18 27 6-6a5 5 0 0 1 7 7l-5 5m8-7-6 6a5 5 0 0 1-7-7l5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g><text x="598" y="204" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">MCP server</text><text x="598" y="276" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">idthw-demo-api-mcp</text></g><g data-component="api"><rect x="1104" y="96" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="1126" y="116" width="58" height="58" rx="16" fill="#EAF5EF"/><g transform="translate(1135 125) scale(0.7692307692307693)" color="#38836F"><rect x="11" y="2" width="36" height="40" rx="7" fill="currentColor" opacity=".12"/><rect x="5" y="10" width="36" height="40" rx="7" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="m18 22-6 8 6 8m10-16 6 8-6 8" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="1320" y="125" width="44" height="25" rx="8" fill="#EAF5EF"/><text x="1342" y="142" fill="#38836F" font-size="13" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">api</text><text x="1126" y="204" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Resource Server</text><text x="1126" y="276" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">api.idthw-api</text></g><g><rect x="368" y="95" width="168" height="52" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="452" y="117" fill="#537AC7" font-size="17" font-weight="500" text-anchor="middle">get_k8s_docs</text><text x="452" y="138" fill="#718096" font-size="15" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">Bearer API token</text></g><g data-token-kind="access" aria-label="Access token"><circle cx="452" cy="196" r="20" fill="#FDFEFF"/><use href="#access-token-key" transform="translate(433 177) scale(.86)" color="#C49A3C"/></g><g><rect x="905" y="95" width="150" height="52" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="980" y="117" fill="#537AC7" font-size="17" font-weight="500" text-anchor="middle">GET /api/docs</text><text x="980" y="138" fill="#718096" font-size="15" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">Same API token</text></g><g data-token-kind="access" aria-label="Access token"><circle cx="980" cy="196" r="20" fill="#FDFEFF"/><use href="#access-token-key" transform="translate(961 177) scale(.86)" color="#C49A3C"/></g><g><rect x="886.91" y="255" width="186.18" height="32" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="980" y="277" fill="#428B76" font-size="17" font-weight="500" text-anchor="middle">200 OK · documents</text></g><g><rect x="358.90999999999997" y="255" width="186.18" height="32" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="452" y="277" fill="#428B76" font-size="17" font-weight="500" text-anchor="middle">Tool result · docs</text></g></g></svg>
