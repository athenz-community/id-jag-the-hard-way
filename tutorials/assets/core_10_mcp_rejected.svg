<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="424" viewBox="0 0 1840 424" role="img" aria-labelledby="title desc"><title id="title">Runtime Proxy rejects a tool call before it reaches MCP or the API</title><desc id="desc">The AI agent calls get_k8s_docs without a valid access token for MCP. MCP Runtime Proxy returns 401 Unauthorized for a missing or invalid token, including a token issued for the API audience. The proxy and MCP server run in the same pod. The MCP server and Resource Server are shown for context but are not called; their downstream connections are gray and dashed.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#537AC7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#428B76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#C46864" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8B96AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8770B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><g id="access-token-key" transform="rotate(42 22 22)"><path d="M19 15h6v12h5v5h-5v8h-6Z" fill="currentColor"/><circle cx="22" cy="10" r="9" fill="currentColor"/><circle cx="22" cy="9" r="3.2" fill="white"/><path d="M16 8a6 6 0 0 1 9-3M20.5 20v15" fill="none" stroke="white" stroke-opacity=".48" stroke-width="1.4" stroke-linecap="round"/></g><filter id="card-shadow" x="-12%" y="-18%" width="124%" height="148%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#253B68" flood-opacity=".055"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".7" fill="#C9D2E2" opacity=".38"/></pattern></defs><rect x=".5" y=".5" width="1839" height="423" rx="26" fill="#FDFEFF" stroke="#E7ECF4"/><rect x="20" y="20" width="1800" height="384" rx="18" fill="url(#grid)"/><g font-family="Avenir Next, Avenir, Segoe UI, Helvetica, Arial, sans-serif"><rect data-group="MCP POD" x="488" y="64" width="864" height="296" rx="24" fill="#F1F3FA" fill-opacity=".8" stroke="#E1E5F0" stroke-width="1"/><text x="510" y="95" fill="#7A85A0" font-size="14" font-weight="600" text-anchor="start" letter-spacing="1.3">MCP POD</text><path d="M328 172 L536 172" fill="none" stroke="#537AC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="328" cy="172" r="3" fill="white" stroke="#537AC7" stroke-width="1.5"/><path d="M536 260 L328 260" fill="none" stroke="#C46864" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7" marker-end="url(#arrow-red)"/><circle cx="536" cy="260" r="3" fill="white" stroke="#C46864" stroke-width="1.5"/><path d="M816 172 L1024 172" fill="none" stroke="#8B96AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7" marker-end="url(#arrow-gray)"/><circle cx="816" cy="172" r="3" fill="white" stroke="#8B96AA" stroke-width="1.5"/><path d="M1304 172 L1512 172" fill="none" stroke="#8B96AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7" marker-end="url(#arrow-gray)"/><circle cx="1304" cy="172" r="3" fill="white" stroke="#8B96AA" stroke-width="1.5"/><g data-component="client"><rect x="48" y="112" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="70" y="132" width="58" height="58" rx="16" fill="#FAEDE6"/><g transform="translate(79 141) scale(0.7692307692307693)" color="#B96850"><rect x="3" y="5" width="47" height="39" rx="8" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="m12 19 6 6-6 6m13 1h10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m43 0 2.5 6.5L52 9l-6.5 2.5L43 18l-2.5-6.5L34 9l6.5-2.5Z" fill="currentColor"/></g><text x="70" y="220" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">AI Agent</text><text x="70" y="292" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">Codex, Claude Code, etc.</text></g><g data-component="proxy"><rect x="536" y="112" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="558" y="132" width="58" height="58" rx="16" fill="#E7F5F5"/><g transform="translate(567 141) scale(0.7692307692307693)" color="#287E8B"><path d="m26 2 20 7v16c0 12-10 20-20 26C16 45 6 37 6 25V9Z" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="m26 9 13 5v12c0 8-6 14-13 19-7-5-13-11-13-19V14Z" fill="currentColor" opacity=".12"/><path d="m17 25 6 6 13-14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="752" y="141" width="44" height="25" rx="8" fill="#E7F5F5"/><text x="774" y="158" fill="#287E8B" font-size="13" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">mcp</text><text x="558" y="220" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">MCP Runtime</text><text x="558" y="247" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Proxy</text><text x="558" y="292" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">mcp.idthw-api-mcp</text></g><g data-component="mcp"><rect x="1024" y="112" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="1046" y="132" width="58" height="58" rx="16" fill="#F3F5F8"/><g transform="translate(1055 141) scale(0.7692307692307693)" color="#9BA5B4"><rect x="9" y="9" width="34" height="34" rx="10" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="M18 1v8m16-8v8M18 43v8m16-8v8M1 18h8m-8 16h8m34-16h8m-8 16h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="m18 27 6-6a5 5 0 0 1 7 7l-5 5m8-7-6 6a5 5 0 0 1-7-7l5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g><text x="1046" y="220" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">MCP server</text><text x="1046" y="292" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">idthw-demo-api-mcp</text></g><g data-component="api"><rect x="1512" y="112" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="1534" y="132" width="58" height="58" rx="16" fill="#F3F5F8"/><g transform="translate(1543 141) scale(0.7692307692307693)" color="#9BA5B4"><rect x="11" y="2" width="36" height="40" rx="7" fill="currentColor" opacity=".12"/><rect x="5" y="10" width="36" height="40" rx="7" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="m18 22-6 8 6 8m10-16 6 8-6 8" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="1728" y="141" width="44" height="25" rx="8" fill="#F3F5F8"/><text x="1750" y="158" fill="#9BA5B4" font-size="13" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">api</text><text x="1534" y="220" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Resource Server</text><text x="1534" y="292" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">api.idthw-api</text></g><g><rect x="352.5" y="112" width="159" height="52" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="432" y="134" fill="#537AC7" font-size="17" font-weight="500" text-anchor="middle">get_k8s_docs</text><text x="432" y="155" fill="#718096" font-size="15" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">No valid MCP AT</text></g><g data-status="error"><rect x="332.92" y="271" width="198.16" height="32" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><g data-error-mark="true" aria-hidden="true" transform="translate(349.92 287)"><circle r="10" fill="#FCEDEC"/><path d="M-5 -5L5 5M5 -5L-5 5" fill="none" stroke="#C43D3D" stroke-width="2.8" stroke-linecap="round"/></g><text x="447" y="293" fill="#C46864" font-size="17" font-weight="500" text-anchor="middle">401 Unauthorized</text></g><g><rect x="862.95" y="112" width="114.10000000000001" height="52" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="920" y="134" fill="#8B96AA" font-size="17" font-weight="500" text-anchor="middle">tools/call</text><text x="920" y="155" fill="#718096" font-size="15" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">Not called</text></g><g><rect x="1337.435" y="112" width="141.13" height="52" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="1408" y="134" fill="#8B96AA" font-size="17" font-weight="500" text-anchor="middle">GET /api/docs</text><text x="1408" y="155" fill="#718096" font-size="15" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">Not called</text></g></g></svg>
