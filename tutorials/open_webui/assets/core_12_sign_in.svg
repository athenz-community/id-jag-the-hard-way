<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="744" viewBox="0 0 1160 744" role="img" aria-labelledby="title desc"><title id="title">The IdP signs the human into Open WebUI</title><desc id="desc">The human signs in with Keycloak. The OIDC redirect completes sign-in to Open WebUI, where the human can submit a prompt. This stage does not yet establish Athenz trust or ID-JAG delegation.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#537AC7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#428B76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#C46864" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8B96AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8770B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><g id="access-token-key" transform="rotate(42 22 22)"><path d="M19 15h6v12h5v5h-5v8h-6Z" fill="currentColor"/><circle cx="22" cy="10" r="9" fill="currentColor"/><circle cx="22" cy="9" r="3.2" fill="white"/><path d="M16 8a6 6 0 0 1 9-3M20.5 20v15